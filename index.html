<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CoderCode's website workspace.">
  <title>CoderCode Workspace</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M12 10 6 16l6 6m8-12 6 6-6 6' fill='none' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: #f8fafc; color: #0f172a; }
    main { width: min(100%, 32rem); }
    .name { margin: 0 0 1.5rem; font-size: 0.875rem; font-weight: 650; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.12; letter-spacing: -0.045em; overflow-wrap: break-word; }
    .description { margin: 1rem 0 0; color: #475569; font-size: 1.0625rem; line-height: 1.6; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } .description { color: #cbd5e1; } }
  </style>
</head>
<body>
  <main>
    <p class="name">CoderCode</p>
    <h1>Ready to build.</h1>
    <p class="description">Your website starts here.</p>
  </main>
</body>
</html>
